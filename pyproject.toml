[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcheat"
version = "0.1.0"
description = "Generate a PNG keyboard shortcut cheat sheet from YAML files"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "pre-commit>=3.7",
    "ruff>=0.4",
]

[project.scripts]
shortcheat = "scripts.generate_png:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
targets = ["scripts"]
skips = []
