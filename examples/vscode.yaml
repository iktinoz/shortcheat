app: "VS Code"
description: "Visual Studio Code Editor Shortcuts"
sections:
  - name: "General"
    shortcuts:
      - keys: "Ctrl + Shift + P"
        description: "Command palette"
      - keys: "Ctrl + P"
        description: "Quick open file"
      - keys: "Ctrl + Shift + E"
        description: "Explorer panel"
      - keys: "Ctrl + Shift + G"
        description: "Source control panel"
      - keys: "Ctrl + ,"
        description: "Open settings"
      - keys: "Ctrl + K Ctrl + S"
        description: "Keyboard shortcuts"
  - name: "Editing"
    shortcuts:
      - keys: "Ctrl + D"
        description: "Select next occurrence"
      - keys: "Ctrl + Shift + L"
        description: "Select all occurrences"
      - keys: "Alt + Up/Down"
        description: "Move line up/down"
      - keys: "Shift + Alt + Up/Down"
        description: "Copy line up/down"
      - keys: "Ctrl + Shift + K"
        description: "Delete line"
      - keys: "Ctrl + /"
        description: "Toggle line comment"
      - keys: "Shift + Alt + F"
        description: "Format document"
  - name: "Navigation"
    shortcuts:
      - keys: "Ctrl + G"
        description: "Go to line"
      - keys: "F12"
        description: "Go to definition"
      - keys: "Alt + F12"
        description: "Peek definition"
      - keys: "Ctrl + Tab"
        description: "Switch between open files"
      - keys: "Ctrl + Shift + O"
        description: "Go to symbol"
  - name: "Terminal"
    shortcuts:
      - keys: "Ctrl + `"
        description: "Toggle integrated terminal"
      - keys: "Ctrl + Shift + `"
        description: "New terminal"
