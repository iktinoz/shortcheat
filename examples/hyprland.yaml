app: "Hyprland"
description: "Hyprland Wayland Compositor Shortcuts"
sections:
  - name: "Window Management"
    shortcuts:
      - keys: "Super + Q"
        description: "Close focused window"
      - keys: "Super + F"
        description: "Toggle fullscreen"
      - keys: "Super + V"
        description: "Toggle floating"
      - keys: "Super + P"
        description: "Toggle pseudo-tile"
      - keys: "Super + Left/Right/Up/Down"
        description: "Move focus"
      - keys: "Super + Shift + Left/Right/Up/Down"
        description: "Move window"
  - name: "Workspaces"
    shortcuts:
      - keys: "Super + 1-9"
        description: "Switch to workspace 1-9"
      - keys: "Super + Shift + 1-9"
        description: "Move window to workspace 1-9"
      - keys: "Super + S"
        description: "Toggle scratchpad"
      - keys: "Super + Mouse Scroll"
        description: "Scroll through workspaces"
  - name: "Applications"
    shortcuts:
      - keys: "Super + Return"
        description: "Open terminal"
      - keys: "Super + D"
        description: "Open launcher (wofi/rofi)"
      - keys: "Super + B"
        description: "Open browser"
      - keys: "Super + E"
        description: "Open file manager"
  - name: "System"
    shortcuts:
      - keys: "Super + M"
        description: "Exit Hyprland"
      - keys: "Super + L"
        description: "Lock screen"
      - keys: "Print"
        description: "Screenshot (grim)"
      - keys: "Super + Print"
        description: "Screenshot selection (slurp)"
