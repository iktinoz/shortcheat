app: "KDE Plasma"
description: "KDE Plasma Desktop Shortcuts"
sections:
  - name: "Window Management"
    shortcuts:
      - keys: "Meta + Up"
        description: "Maximize window"
      - keys: "Meta + Down"
        description: "Minimize window"
      - keys: "Meta + Left"
        description: "Snap window left"
      - keys: "Meta + Right"
        description: "Snap window right"
      - keys: "Meta + Shift + Up"
        description: "Move window to upper screen"
      - keys: "Alt + F4"
        description: "Close window"
  - name: "Virtual Desktops"
    shortcuts:
      - keys: "Ctrl + F1"
        description: "Switch to desktop 1"
      - keys: "Ctrl + F2"
        description: "Switch to desktop 2"
      - keys: "Meta + Tab"
        description: "Present windows (current desktop)"
      - keys: "Meta + W"
        description: "Present windows (all desktops)"
  - name: "System"
    shortcuts:
      - keys: "Meta + L"
        description: "Lock screen"
      - keys: "Meta + E"
        description: "Open file manager"
      - keys: "Meta + Space"
        description: "KRunner (launcher)"
      - keys: "Print"
        description: "Take screenshot"
      - keys: "Meta + Print"
        description: "Screenshot of current window"
