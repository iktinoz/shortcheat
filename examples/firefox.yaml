app: "Firefox"
description: "Mozilla Firefox Browser Shortcuts"
sections:
  - name: "Navigation"
    shortcuts:
      - keys: "Ctrl + L"
        description: "Focus address bar"
      - keys: "Ctrl + T"
        description: "New tab"
      - keys: "Ctrl + W"
        description: "Close tab"
      - keys: "Ctrl + Shift + T"
        description: "Reopen closed tab"
      - keys: "Ctrl + Tab"
        description: "Next tab"
      - keys: "Ctrl + Shift + Tab"
        description: "Previous tab"
      - keys: "Alt + Left"
        description: "Back"
      - keys: "Alt + Right"
        description: "Forward"
  - name: "Page"
    shortcuts:
      - keys: "Ctrl + F"
        description: "Find in page"
      - keys: "Ctrl + R"
        description: "Reload page"
      - keys: "Ctrl + Shift + R"
        description: "Hard reload (bypass cache)"
      - keys: "Ctrl + +"
        description: "Zoom in"
      - keys: "Ctrl + -"
        description: "Zoom out"
      - keys: "Ctrl + 0"
        description: "Reset zoom"
      - keys: "F"
        description: "Toggle fullscreen"
  - name: "Developer Tools"
    shortcuts:
      - keys: "F12"
        description: "Toggle DevTools"
      - keys: "Ctrl + Shift + I"
        description: "Inspector"
      - keys: "Ctrl + Shift + C"
        description: "Pick element"
      - keys: "Ctrl + Shift + K"
        description: "Web console"
