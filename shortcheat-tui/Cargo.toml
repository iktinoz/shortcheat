[package]
name = "shortcheat-tui"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal cheat-sheet viewer (Everforest) for shortcheat YAML"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"

[profile.release]
lto = "thin"
