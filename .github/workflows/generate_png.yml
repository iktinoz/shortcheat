name: Generate Cheat Sheet PNG

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: cargo test

      - name: Copy examples to config dir (CI)
        run: |
          mkdir -p ~/.config/shortcheat
          cp examples/*.yaml ~/.config/shortcheat/

      - name: Generate cheat_sheet.png
        run: cargo run --release -- png

      - name: Commit updated PNG
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: regenerate cheat_sheet.png [skip ci]"
          file_pattern: "cheat_sheet.png"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
