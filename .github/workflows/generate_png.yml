name: Generate Cheat Sheet PNG

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: cargo test

      - name: Copy examples to config dir (CI)
        run: |
          mkdir -p ~/.config/shortcheat
          cp examples/*.yaml ~/.config/shortcheat/

      - name: Generate cheat_sheet.png
        run: cargo run --release -- png

      - name: Commit updated PNG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate cheat_sheet.png [skip ci]"
          file_pattern: "cheat_sheet.png"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
